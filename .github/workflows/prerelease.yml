name: Pre-Release

on:
  push:
    branches: ["main-dev"]
  pull_request:
    branches: ["main-dev"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Dependencies
        run: pip install -r requirements.txt pytest mypy
      - name: Check Types
        run: mypy --strict tinysemver
      - name: Run PyTest
        run: pytest test.py -v

  semver:
    runs-on: ubuntu-latest
    name: Update Version
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run TinySemVer
        uses: ./ # This uses the action defined in the current repository
        with:
          verbose: "true"
          changelog-file: "CHANGELOG.md"
          version-file: "VERSION"
          update-version-in: |
            pyproject.toml:version = "(.*)"
            tinysemver/__init__.py:__version__ = "(.*)"
          dry-run: "true"
