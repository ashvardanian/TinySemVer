name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    name: Run Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: pip install -r requirements.txt pytest
      - name: Run PyTest
        run: pytest test.py -v

  publish_python:
    name: Publish Python
    runs-on: ubuntu-26.04
    needs: test
    environment:
      name: pypi
      url: https://pypi.org/p/tinysemver
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -r requirements.txt
      - name: Build package
        run: python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
